name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - uses: actions/cache@v4
        with:
          path: app/lumen.jks
          key: lumen-keystore-v1
      - name: Create signing key
        run: |
          if [ ! -f app/lumen.jks ]; then
            keytool -genkeypair -keystore app/lumen.jks -storepass lumen123 -keypass lumen123 -alias lumen -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Lumen TV"
          fi
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LumenTV-apk
          path: app/build/outputs/apk/debug/*.apk
